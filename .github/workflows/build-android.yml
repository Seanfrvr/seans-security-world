name: Build Sean's Sec Lab Android

on:
  push:
    branches: [ native-app ]
    paths:
      - 'native-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: native-app
        run: npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: native-app
        run: npx cap add android

      - name: Sync web app
        working-directory: native-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: native-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: cp native-app/android/app/build/outputs/apk/debug/app-debug.apk "Seans-Sec-Lab-Android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Seans-Sec-Lab-Android
          path: Seans-Sec-Lab-Android.apk
          if-no-files-found: error
          retention-days: 30
